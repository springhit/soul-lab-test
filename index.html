             0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
             0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,

             0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
             0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var bytes = [], i, c;
    for(i=0;i<msg.length;i++){
      c = msg.charCodeAt(i);
      if(c < 0x80) bytes.push(c);
      else if(c < 0x800){ bytes.push(0xc0|(c>>6), 0x80|(c&63)); }
      else if(c < 0xd800 || c >= 0xe000){ bytes.push(0xe0|(c>>12), 0x80|((c>>6)&63), 0x80|(c&63)); }
      else {

      }
      a=H[0];b=H[1];c2=H[2];d=H[3];e=H[4];f=H[5];g=H[6];hh=H[7];

      '<div style="text-align:left;"><span class="q-tag">'+q.tag+'</span></div>' +
      '<div class="q-title">'+q.q+'</div><div class="q-note">'+q.note+'</div>';
    for(var i=0;i<q.opts.length;i++)
      html+='<button type="button" class="option" data-i="'+i+'">'+q.opts[i][0]+'</button>';
    html+='</div><div class="footnote">选择最接近你真实反应的一项</div>';
    root.innerHTML=html;
    var btns=root.querySelectorAll(".option");
    for(var j=0;j<btns.length;j++)
      btns[j].addEventListener("click",function(){ pick(parseInt(this.getAttribute("data-i"),10)); });
    window.scrollTo(0,0);
  }

  function pick(i){
    var s=QUESTIONS[state.idx].opts[i][1];
    for(var k in s){ state.scores[k]=(state.scores[k]||0)+s[k]; }
    state.picks.push(i);
    state.idx++;
    if(state.idx>=QUESTIONS.length){
      state.view="gen";
      if(CODE){ submitAnswers(); } else { doGenerating(); setTimeout(renderResult, 2600); }
    } else renderQuiz();
  }

  function buildVec(){
    // 先计算每个维度的理论最大得分（每题取该维度最高贡献值累加）
    var maxScore = {};
    for(var d2=0; d2<KEYS.length; d2++) maxScore[KEYS[d2]] = 0;
    for(var q2=0; q2<QUESTIONS.length; q2++){
      var perQ = {};
      for(var k2 in maxScore) perQ[k2] = 0;
      for(var o2=0; o2<QUESTIONS[q2].opts.length; o2++){
        var s2 = QUESTIONS[q2].opts[o2][1];
        for(var k3 in s2){ if(s2[k3] > perQ[k3]) perQ[k3] = s2[k3]; }
      }
      for(var k4 in perQ) maxScore[k4] += perQ[k4];
    }
    // 等比缩放：raw/maxScore → 映射到 20~100 区间，保证区分度
    var vec = {};
    for(var i=0; i<KEYS.length; i++){
      var k = KEYS[i];
      var raw = state.scores[k] || 0;
      var max = maxScore[k] || 1;
      vec[k] = Math.round(20 + (raw / max) * 80);
    }
    return vec;
  }
  function pool(){
    if(state.gender==="m") return MALE;
    if(state.gender==="f") return FEMALE;
    return MALE.concat(FEMALE);
  }
  function dist(a,b){
    // 加权欧氏距离：按人物库中各维度的离散度反比加权，防止某几个维度垄断匹配
    var s=0;
    for(var i=0;i<KEYS.length;i++){
      var k=KEYS[i];
      var mean=0;
      var pl=pool();
      for(var j=0;j<pl.length;j++) mean+=pl[j].profile[k];
      mean/=pl.length;
      var varr=0;
      for(var j2=0;j2<pl.length;j2++) varr+=(pl[j2].profile[k]-mean)*(pl[j2].profile[k]-mean);
      var sd=Math.sqrt(varr/pl.length)||1;
      var d=(a[k]-b[k])/sd;
      s+=d*d;
    }
    return Math.sqrt(s);
  }
  /* ================= 选项-人物亲和度表 =================
     每题 4 个选项各有 [男性人物key或null, 女性人物key或null]，
     选中的选项会给对应人物减去亲和距离，保证每位人物都真实可达 */
  var FAV = [
    [ "ss","csh",  "xy","wzt",  "sm","xth",  "gz","sgwe" ],
    [ "zyz","xth","xy","hml",  "zgl","csh", "sm","sgwe" ],
    [ "ss","lqz",  "sm","bzh",  "zjz","wzt", "wyk","sgwe" ],
    [ "zjz","xyy2","wyk","hml", "ss","xyy",   "sm","xth"  ],
    [ "lb","xyy",  "zyz","bzh", "lb","lqz",   "xy","hml"  ],
    [ "zgl","pyz", "cc","csh",  "gz","xyy2",  "wyk","bzh" ],
    [ "zjz","pyz", "gz","sgwe", "sm","xyy",   "zgl","xth" ],
    [ "gz","xyy2", "xy","pyz",  "sm","xth",   "cc","wzt"  ],
    [ "lb","lqz",  "sgwe","xyy","csh","xyy",  "cc","lqz" ],
    [ "ss","lqz",  "cc","bzh",  "zyz","hml",  "lb","xyy"  ],
    [ "hml","pyz", "lqz","xyy", "gz","csh",   "bzh","sgwe"],
    [ "zyz","wzt", "sm","xyy2", "zjz","xth",  "wyk","csh" ],
    [ "wyk","hml", "sm","xyy",  "gz","csh",   "zjz","xyy2"],
    [ "lb","lqz",  "gz","bzh",  "ss","sgwe",  "zyz","wzt" ],
    [ "cc","pyz",  "zgl","csh", "wyk","xyy2", "ss","hml"  ],
    [ "zgl","wzt", "xy","hml",  "gz","xyy2",  "wyk","bzh" ]
  ];
  var FAV_BONUS = 10; // 每个亲和命中的距离减免

  function match(){
    var vec=buildVec(), pl=pool();
    var isMale = state.gender==="m", isFemale = state.gender==="f";
    var favSet = {};
    for(var q=0; q<state.picks.length && q<FAV.length; q++){
      var oi = state.picks[q];
      var mk = FAV[q][oi*2], fk = FAV[q][oi*2+1];   // 扁平结构：偶数位=男，奇数位=女
      if(!mk && !fk) continue;
      if(isMale && mk) favSet[mk] = (favSet[mk]||0)+1;
      else if(isFemale && fk) favSet[fk] = (favSet[fk]||0)+1;
      else if(!isMale && !isFemale){ if(mk) favSet[mk]=(favSet[mk]||0)+1; if(fk) favSet[fk]=(favSet[fk]||0)+1; }
    }
    var ranked=pl.map(function(c){
      // 亲和命中数为主（每个命中减 10 分距离），八维距离为辅；不钳位，保留真实差距用于排序
      var d = dist(vec,c.profile)*0.8 - 10*(favSet[c.key]||0);
      return {c:c, d:d};
    }).sort(function(a,b){ return a.d-b.d; });
    var top=ranked[0];
    var pct=Math.max(82,Math.min(97,Math.round(101-top.d*0.9)));
    var dom=KEYS[0];
    for(var i=1;i<KEYS.length;i++) if(vec[KEYS[i]]>vec[dom]) dom=KEYS[i];
    return {vec:vec,best:top.c,pct:pct,dom:dom,ranked:ranked};
  }

  function doGenerating(){
    state.view="gen"; topTitle.textContent="正在生成报告";
    var steps=["正在解析你的 16 次历史选择…","检索你的性格特征坐标…","计算八维能力结构…","绘制擅长地图…","撰写专属匹配报告…"];
    var html='<div class="card"><div style="font-size:34px;">✨</div>' +
      '<h1 style="font-size:17px;">正在生成你的专属报告</h1>' +
      '<div class="gen-bar"><i id="genbar"></i></div><div class="gen-steps" id="steps">';
    for(var i=0;i<steps.length;i++) html+='<div data-i="'+i+'">· '+steps[i]+'</div>';
    html+='</div></div>';
    root.innerHTML=html;
    var bar=document.getElementById("genbar"), els=root.querySelectorAll("#steps div"), p=0;
    var timer=setInterval(function(){
      p+=5+Math.random()*8; if(p>100)p=100;
      bar.style.width=p+"%";
      var act=Math.floor(p/100*steps.length);
      for(var k=0;k<els.length;k++) if(k<=act) els[k].classList.add("on");
      if(p>=100){ clearInterval(timer); bar.style.width="100%"; }
    },120);
  }

  function renderResult(){
    state.view="result"; topTitle.textContent="我的历史人物匹配报告";
    var m=match(); state.matchInfo=m;
    var vec=m.vec, c=m.best, dom=m.dom;
    var top3=KEYS.slice().sort(function(a,b){return vec[b]-vec[a];}).slice(0,3);
    var top2=top3.slice(0,2);

    var dimHtml="";
    for(var i=0;i<KEYS.length;i++){
      var k=KEYS[i];
      dimHtml+='<div class="dim-row"><div class="dn">'+k+'</div><div class="db"><i style="width:'+vec[k]+'%"></i></div><div class="dv">'+vec[k]+'</div></div>';
    }

    var colorTitles=["第一底色","隐藏天赋","长期优势"];
    var colorHtml="";
    for(var t=0;t<top3.length;t++){
      var dk=top3[t];
      colorHtml+='<div class="color-card"><h4>'+colorTitles[t]+' · '+dk+'</h4><p>'+DIM_DESC[dk]+' 这也是你与'+c.name+'最接近的一层性格底色。</p></div>';
    }

    var skillHtml="";
    for(var s=0;s<top3.length;s++){
      var sk=top3[s], d=DOMAINS[sk];
      skillHtml+='<div class="skill-card"><h4>'+d.name+'</h4><p>'+d.desc+'</p><div class="sc">🎯 常见场景：'+d.scene+'</div></div>';
    }

    var lifeHtml="";
    for(var l=0;l<top2.length;l++)
      for(var n=0;n<LIFE[top2[l]].length;n++)
        lifeHtml+='<div class="life-item"><div class="li">'+LIFE[top2[l]][n].slice(0,2)+'</div><p>'+LIFE[top2[l]][n].slice(2)+'</p></div>';

    var getAlong=GET_ALONG(top2, c);
    var turnsHtml="";
    for(var tt=0;tt<c.turns.length;tt++)
      turnsHtml+='<div class="turn-item"><h4>'+c.turns[tt][0]+'</h4><p>'+c.turns[tt][1]+'</p></div>';

    var rankHtml="";
    var rl=m.ranked.slice(0,4);
    for(var r=0;r<rl.length;r++){
      var p2=(r===0)?m.pct:Math.max(40,Math.round(m.pct-rl[r].d*1.6));
      rankHtml+='<div class="dim-row"><div class="dn" style="width:64px;">'+rl[r].c.name+'</div><div class="db"><i style="width:'+p2+'%"></i></div><div class="dv" style="width:34px;">'+p2+'%</div></div>';
    }

    root.innerHTML =
      '<div class="hero">' +
        '<div class="hl">你 的 历 史 人 物 匹 配 结 果</div>' +
        '<div class="pct">'+m.pct+'%</div>' +
        '<div class="portrait-wrap">' +
          '<div class="frame">' +
            (PORTRAITS[c.key] ? '<img src="'+PORTRAITS[c.key]+'" alt="'+c.name+'画像">' : '<div class="face">'+c.face+'</div>') +
          '</div>' +
          '<div class="seal">前世人物志</div>' +
        '</div>' +
        '<div class="nm">'+c.name+'</div>' +
        '<div class="dy">'+c.dyn+' · '+c.role+'</div>' +
        '<div class="tagwrap">'+c.tags.map(function(t){return "<span>"+t+"</span>";}).join("")+'</div>' +
        '<div class="dom-tag">主导维度：'+dom+'</div>' +
        '<div class="voice"><div class="vh">人物心声</div><p>“'+c.voice+'”</p></div>' +
      '</div>' +

      '<div class="sec"><div class="sec-h"><em>01</em>人物自画像</div><p>'+c.self+'</p></div>' +

      '<div class="sec"><div class="sec-h"><em>02</em>八维能力结构</div>'+dimHtml+
        '<p style="font-size:11.5px;color:#a79dc6;margin-top:6px;">基于 16 道情境题的选择分布计算</p></div>' +

      '<div class="sec"><div class="sec-h"><em>03</em>你与 TA 的共同底色</div>'+colorHtml+'</div>' +

      '<div class="sec"><div class="sec-h"><em>04</em>你的擅长地图</div>'+skillHtml+
        '<p style="font-size:12px;color:#8d84ad;">以上为你的前三大优势维度对应的领域，是你最容易被看见的地方。</p></div>' +

      '<div class="sec"><div class="sec-h"><em>05</em>生活中的你，原来这么擅长这些</div>'+lifeHtml+'</div>' +

      '<div class="sec"><div class="sec-h"><em>06</em>你的相处之道</div>'+getAlong+'</div>' +

      '<div class="sec"><div class="sec-h"><em>07</em>性格盲点与风险提醒</div>' +
        '<div class="blind-card"><h4>👀 可能的盲点</h4><p>'+c.blind+'</p></div>' +
        '<div class="blind-card"><h4>⚠️ 风险提醒</h4><p>'+c.risk+'</p></div>' +
        '<div class="blind-card"><h4>💡 给你的建议</h4><p>'+c.advice+'</p></div>' +
      '</div>' +

      '<div class="sec"><div class="sec-h"><em>08</em>TA 的人生转折，给你的启示</div>'+turnsHtml+'</div>' +

      '<div class="sec"><div class="sec-h"><em>09</em>TA 说过的三句话</div>' +
        c.lines.map(function(l){return '<div class="line-item">'+l+'</div>';}).join("")+'</div>' +

      '<div class="sec"><div class="sec-h"><em>10</em>相似人物排行</div>'+rankHtml+
        '<p style="font-size:11.5px;color:#a79dc6;margin-top:6px;">距离按八维性格向量计算</p></div>' +

      '<div style="margin:14px 0 4px;">' +
        '<button type="button" class="btn btn-main" id="btn-save">📸 保存结果图片</button>' +
        '<div style="height:10px;"></div>' +
        '<button type="button" class="btn btn-ghost" id="btn-again">长按截图保存报告</button>' +
      '</div>' +
      '<div id="saveLayer" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(20,14,45,.88);' +
        'overflow:auto;padding:30px 16px;text-align:center;">' +
        '<p style="color:#d8d0f5;font-size:14px;margin-bottom:14px;">长按下方图片保存到相册</p>' +
        '<img id="saveImg" style="max-width:100%;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);">' +
        '<div style="margin-top:18px;"><button class="btn btn-ghost" style="width:auto;padding:10px 30px;" id="saveClose">关 闭</button></div>' +
      '</div>' +
      '<div class="footnote">长按截图保存 · 分享给朋友看看 TA 是谁<br>本测试用于趣味自探索，不构成心理测评</div>';

    document.getElementById("btn-again").addEventListener("click",function(){
      if (CODE) { renderLocked(); } else { resetAll(); renderStart(); }
    });

    document.getElementById("btn-save").addEventListener("click", function(){
      var btn = this, layer = document.getElementById("saveLayer");
      btn.disabled = true; btn.textContent = "正在生成图片…";
      var hero = document.querySelector(".hero");
      if (!window.html2canvas) {
        // CDN 加载失败时降级为页面截图提示
        btn.textContent = "📸 保存结果图片"; btn.disabled = false;
        window.alert("请直接使用手机截屏保存结果");
        return;
      }
      html2canvas(hero, { useCORS:true, backgroundColor:null, scale:2 }).then(function(canvas){
        var data = canvas.toDataURL("image/png");
        document.getElementById("saveImg").src = data;
        layer.style.display = "block";
        btn.disabled = false; btn.textContent = "📸 保存结果图片";
      }).catch(function(){
        btn.textContent = "📸 保存结果图片"; btn.disabled = false;
        window.alert("生成失败，请直接截屏保存");
      });
    });
    document.getElementById("saveClose").addEventListener("click", function(){
      document.getElementById("saveLayer").style.display = "none";
    });
    window.scrollTo(0,0);
  }

  function GET_ALONG(top2, c) {
    var map = {
      "决断":"和慢性子相处时，给对方留一点消化时间——你的效率，不必成为别人的压力。",
      "共情":"你容易把别人的情绪背在身上。记住：陪伴不等于承担，你可以心疼，但不必负责。",
      "开创":"你讨厌重复，但关系里有相当一部分幸福恰恰来自「重复」。给稳定一点耐心。",
      "洞察":"不是每句话都有言外之意。偶尔「想多了」的时候，直接问一句，比推演半天更有效。",
      "表达":"你的语言很有感染力，但也记得留白——有些时刻，安静地陪着比说漂亮话更有力量。",
      "经营":"你习惯计算投入产出，但感情里的账，算得太清会伤人。留些「不划算」的温柔。",
      "随性":"你的松弛很迷人，但重要的人偶尔需要你的「确定」。在关键时刻给出明确态度，比什么都珍贵。",
      "担当":"你扛下了太多没人看见的事。学会说「这次你来」，不是逃避，是给彼此靠近的机会。"
    };
    var html='<div class="info-card"><h4>🤝 与「'+top2[0]+'」特质的人相处</h4><p>'+map[top2[0]]+'</p></div>' +
      '<div class="info-card"><h4>💬 与「'+top2[1]+'」特质的人相处</h4><p>'+map[top2[1]]+'</p></div>' +
      '<div class="info-card"><h4>❤️ 像'+c.name+'一样去爱</h4><p>'+c.love+'</p></div>';
    return html;
  }

  boot();
})();
</script>
